apiVersion: v1
kind: Secret
metadata:
  name: {{ include "activepieces.fullname" . }}-secrets
  labels:
    {{- include "activepieces.labels" . | nindent 4 }}
  annotations:
    {{- if or (.Capabilities.APIVersions.Has "secretgenerator.mittwald.de/v1alpha1/BasicAuth") (not (eq (index .Values "kubernetes-secret-generator" "enabled") false)) }}
    secret-generator.v1.mittwald.de/autogenerate: encryption-key
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
    {{- end }}
type: Opaque
{{- if or (.Capabilities.APIVersions.Has "secretgenerator.mittwald.de/v1alpha1/BasicAuth") (not (eq (index .Values "kubernetes-secret-generator" "enabled") false)) }}
data: {}
{{- else }}
data:
  encryption-key: {{ default (randAlphaNum 32) .Values.activepieces.secrets.encryptionKey | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "activepieces.fullname" . }}-jwt-secret
  labels:
    {{- include "activepieces.labels" . | nindent 4 }}
  annotations:
    {{- if or (.Capabilities.APIVersions.Has "secretgenerator.mittwald.de/v1alpha1/BasicAuth") (not (eq (index .Values "kubernetes-secret-generator" "enabled") false)) }}
    secret-generator.v1.mittwald.de/autogenerate: jwt-secret
    secret-generator.v1.mittwald.de/length: "64"
    {{- end }}
type: Opaque
{{- if or (.Capabilities.APIVersions.Has "secretgenerator.mittwald.de/v1alpha1/BasicAuth") (not (eq (index .Values "kubernetes-secret-generator" "enabled") false)) }}
data: {}
{{- else }}
data:
  jwt-secret: {{ default (randAlphaNum 64) .Values.activepieces.secrets.jwtSecret | b64enc | quote }}
{{- end }}
